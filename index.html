<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barbearia fio de ouro</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/27fb11b8bb.js" crossorigin="anonymous"></script>
</head>
<body>
    <div class="container">
        <header class="estilo">
            <form action="#" method="post" class="pesquisa">
                <button type="submit" aria-label="Pesquisar">🔍</button>
                <input type="search" name="busca" placeholder="buscar por cliente, agendamento..." aria-label="Buscar no painel">
            </form>
            <button class="notificacao" aria-label="Notificações: 3 novas">
            <span class="sino">♧</span>
            <span class="contador">3</span> 
           </button>

           <div class="perfil">
           <img src="/midias/patrick.png" alt="Foto do administrador">

           <span class="nome">Patrick costa</span>

           <button class="seta" aria-label="Abrir menu do perfil">
        ▾
    </button>
</div>
        </header>
        <aside class="nav-bar estilo">
            <div class="nav-img-tit">
                <img src="midias/Emblema dourado de barbearia com poste clássico.png" alt="emblema site">
                <h2>Barbearia <br> <span class="span2">Fio de Ouro</span></h2>
            </div>
            <p>Paínel Administrativo</p>
            <nav>
                <ul>
                    <li><i class="fa-regular fa-house icone"  style="color: rgb(249, 247, 247);"></i> <a href="#dashboard">Dashboard</a></li>
                    <li><i class="fa-regular fa-calendar-days icone" style="color: rgb(249, 247, 247);"></i> <a href="#agendamentos">Agendamentos</a></li>
                    <li><i class="fa-solid fa-scissors icone" style="color: rgb(249, 247, 247);"></i> <a href="#servicos">Serviços</a></li>
                    <li><i class="fa-regular fa-user icone" style="color: rgb(249, 247, 247);"></i> <a href="#barbeiros">Barbeiros</a></li>
                    <li><i class="fa-solid fa-users icone" style="color: rgb(249, 247, 247);"></i> <a href="#clientes">Clientes</a></li>
                    <li><i class="fa-regular fa-clock icone" style="color: rgb(249, 247, 247);"></i> <a href="#horarios">Horários</a></li>
                    <li><i class="fa-solid fa-chart-column icone" style="color: rgb(249, 247, 247);"></i> <a href="#relatorios">Relatórios</a></li>
                    <li><i class="fa-solid fa-gear icone"    style="color: rgb(249, 247, 247);"></i> <a href="#configuracoes">Configurações</a></li>
                </ul>
            </nav>
        </aside>
        <div class="minhas-informacoes estilo">
            <div class="info-titulos">
                <h2>Bom dia, Patrick!</h2>
                <p>Aqui está um resumo do seu dia.</p>
                <input type="date" name="data" id="data">
            </div>
        </div>
        <main class="principal estilo"> 
        <section>item1</section>
        <section>item2</section>
        <section>item3</section>
        </main>
        <aside class="estilo">
            <div>item1</div>
            <div>item2</div>
            <div>item3</div>
        </aside>
        <footer class="estilo">rodape</footer>
    </div>
</body>
</html>
