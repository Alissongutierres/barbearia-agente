services:
  barberbot:
    container_name: barberbot_local
    build:
      context: ../bot
    restart: unless-stopped
    environment:
      PORT: 3001
      EVOLUTION_API_URL: http://evolution-api:8080
      EVOLUTION_API_KEY: barberbot-local-demo-key-2026
      EVOLUTION_INSTANCE: barberbot
      TZ: America/Sao_Paulo
    volumes:
      - ../bot/data:/app/data
    networks:
      - barberbot-evolution

  evolution-api:
    container_name: barberbot_evolution_api
    image: evoapicloud/evolution-api:v2.3.7
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - .env
    volumes:
      - evolution_instances:/evolution/instances
    networks:
      - barberbot-evolution

  postgres:
    container_name: barberbot_evolution_postgres
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: evolution
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: barberbot_local_postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - barberbot-evolution

  redis:
    container_name: barberbot_evolution_redis
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - redis_data:/data
    networks:
      - barberbot-evolution

volumes:
  evolution_instances:
  postgres_data:
  redis_data:

networks:
  barberbot-evolution:
    driver: bridge
